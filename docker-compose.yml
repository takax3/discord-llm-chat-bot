services:
  discordbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discordbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      SQLITE_PATH: /app/data/discordbot.db
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - discordbot-data:/app/data
    stop_grace_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: discord-llm-chat-bot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    stop_grace_period: 30s

volumes:
  discordbot-data:
  ollama-data:
