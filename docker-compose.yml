services:
  discordbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discordbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      SQLITE_PATH: /app/data/discordbot.db
    volumes:
      - discordbot-data:/app/data
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  discordbot-data:
